name: CamPipe
options:
  bundleIdPrefix: dev.local
  deploymentTarget:
    iOS: "15.0"
targets:
  CamPipe:
    type: application
    platform: iOS
    sources:
      - path: CamPipe
    info:
      path: CamPipe/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: "Talks to the ESP32-CAM to fetch photos and send back results."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.campipe
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
