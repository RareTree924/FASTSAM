name: CamPipe
options:
  bundleIdPrefix: dev.local
  deploymentTarget:
    iOS: "27.0"   # SAM 3 runs on Core AI (iOS 27+)
packages:
  CoreAIModels:   # Apple's Core AI runtime helpers; pinned to the commit SAM3/ is exported from (main.yml)
    url: https://github.com/apple/coreai-models
    revision: 41922177d06d50cc878e18e3bbad79b5a02c65fd
targets:
  CamPipe:
    type: application
    platform: iOS
    scheme: {}          # shared scheme, so xcodebuild -scheme CamPipe always finds it on CI
    sources:
      - path: CamPipe
      - path: SAM3        # SAM 3 model bundle from the Build IPA workflow (not in git: ~600 MB)
        type: folder      # copied into the app as one folder, as ImageSegmenter expects
        optional: true
    dependencies:
      - package: CoreAIModels
        product: CoreAISegmentation
    info:
      path: CamPipe/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: "Talks to the ESP32-CAM to fetch photos and send back results."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.campipe
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
